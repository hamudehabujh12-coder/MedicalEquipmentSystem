<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<title>Neues Passwort</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f8;
    font-family:Arial,sans-serif;

}

.card{

    width:430px;
    background:white;
    padding:35px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);

}

h2{

    text-align:center;
    color:#1f2937;
    margin-bottom:25px;

}

input{

    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:18px;

}

button{

    width:100%;
    padding:12px;
    background:#1f2937;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;

}

button:hover{

    background:#374151;

}

</style>

</head>

<body>

<div class="card">

<h2>🔑 Neues Passwort festlegen</h2>

<form method="post">

{% csrf_token %}

{{ form.as_p }}

<button type="submit">

💾 Passwort speichern

</button>

</form>

</div>

</body>

</html>
