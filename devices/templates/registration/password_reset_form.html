<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<title>Passwort zurücksetzen</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f8;
    font-family:Arial,sans-serif;

}

.reset-card{

    width:420px;
    background:white;
    padding:35px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);

}

.reset-title{

    text-align:center;
    color:#1f2937;
    margin-bottom:30px;

}

label{

    font-weight:bold;
    margin-bottom:8px;
    display:block;

}

input{

    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    margin-top:8px;
    margin-bottom:20px;

}

button{

    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#1f2937;
    color:white;
    font-size:16px;
    cursor:pointer;

}

button:hover{

    background:#374151;

}

.back{

    display:block;
    margin-top:18px;
    text-align:center;
    text-decoration:none;

}

</style>

</head>

<body>

<div class="reset-card">

<h2 class="reset-title">
🏥 Passwort zurücksetzen
</h2>

<p>
Bitte geben Sie Ihre E-Mail-Adresse ein.
Wir senden Ihnen einen Link zum Zurücksetzen des Passworts.
</p>

<form method="post">

{% csrf_token %}

{{ form.as_p }}

<button type="submit">

📧 Link senden

</button>

</form>

<a href="{% url 'login' %}" class="back">

← Zurück zum Login

</a>

</div>

</body>

</html>
