<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<title>E-Mail gesendet</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f8;
    font-family:Arial,sans-serif;
}

.card{
    width:500px;
    background:white;
    padding:40px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    text-align:center;
}

h2{
    color:#16a34a;
    margin-bottom:20px;
}

p{
    color:#555;
    line-height:1.7;
}

a{
    display:inline-block;
    margin-top:25px;
    text-decoration:none;
    background:#1f2937;
    color:white;
    padding:12px 25px;
    border-radius:8px;
}

a:hover{
    background:#374151;
}

</style>

</head>

<body>

<div class="card">

<h2>✅ E-Mail wurde gesendet</h2>

<p>

Falls ein Benutzer mit dieser E-Mail-Adresse existiert,
haben wir einen Link zum Zurücksetzen des Passworts gesendet.

</p>

<a href="{% url 'login' %}">

Zurück zum Login

</a>

</div>

</body>

</html>
