<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Medizintechnik</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>

        body {
            height: 100vh;
            margin: 0;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        .login-card {

            width: 380px;
            background: white;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);

        }


        .login-title {

            text-align:center;
            margin-bottom:30px;
            color:#1f2937;

        }


        input {

            width:100%;
            padding:12px;
            border-radius:8px;
            border:1px solid #ccc;
            margin-top:8px;

        }


        .login-button {

            width:100%;
            margin-top:20px;
            padding:12px;

            background:#1f2937;
            color:white;

            border:none;
            border-radius:8px;

            font-size:16px;
            cursor:pointer;

        }


        .login-button:hover {

            background:#374151;

        }


    </style>


</head>


<body>


<div class="login-card">


    <h2 class="login-title">

        🏥 Medizintechnik

    </h2>



    <form method="post" autocomplete="off">

        {% csrf_token %}



        {% if error %}

        <div class="alert alert-danger">

            {{ error }}

        </div>

        {% endif %}



        <label>
            Benutzername
        </label>

        <input 
        type="text"
        name="username"
        autocomplete="off"
        >



        <br><br>



        <label>
            Passwort
        </label>

        <input 
        type="password"
        name="password"
        autocomplete="new-password"
        >




        <button 
        type="submit"
        class="login-button">

            🔐 Anmelden

        </button>
        <div style="text-align:center; margin-top:20px;">

            <a href="{% url 'password_reset' %}"
            style="text-decoration:none;color:#2563eb;font-weight:600;">

                Passwort vergessen?

            </a>

        </div>


    </form>



</div>


</body>

</html>
