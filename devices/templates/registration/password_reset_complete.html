<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<title>Passwort geändert</title>

<style>

body{

    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f8;
    font-family:Arial,sans-serif;

}

.card{

    width:450px;
    background:white;
    padding:40px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    text-align:center;

}

h2{

    color:#16a34a;
    margin-bottom:20px;

}

p{

    color:#555;
    margin-bottom:30px;
    line-height:1.6;

}

a{

    display:inline-block;
    padding:12px 30px;
    background:#1f2937;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;

}

a:hover{

    background:#374151;

}

</style>

</head>

<body>

<div class="card">

<h2>
✅ Passwort erfolgreich geändert
</h2>

<p>

Ihr Passwort wurde erfolgreich geändert.

Sie können sich jetzt mit Ihrem neuen Passwort anmelden.

</p>

<a href="{% url 'login' %}">

🔐 Zum Login

</a>

</div>

</body>

</html>
