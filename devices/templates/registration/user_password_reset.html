{% extends "devices/base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>
        🔑 Passwort zurücksetzen
    </h2>

    <p>
        Benutzer:
        <strong>{{ edit_user.username }}</strong>
    </p>

    <form method="post">

        {% csrf_token %}

        {% if edit_user == request.user %}

            <!-- =========================================
                 ALTES PASSWORT
            ========================================== -->

            <div class="mb-3">

                <label class="form-label">
                    Altes Passwort
                </label>

                <input
                    type="password"
                    name="old_password"
                    class="form-control"
                    required
                >

            </div>

        {% endif %}


        <!-- =========================================
             NEUES PASSWORT
        ========================================== -->

        <div class="mb-3">

            <label class="form-label">
                Neues Passwort
            </label>

            <input
                type="password"
                name="password1"
                class="form-control"
                required
            >

        </div>


        <!-- =========================================
             PASSWORT BESTÄTIGEN
        ========================================== -->

        <div class="mb-3">

            <label class="form-label">
                Neues Passwort wiederholen
            </label>

            <input
                type="password"
                name="password2"
                class="form-control"
                required
            >

        </div>


        <!-- =========================================
             BUTTONS
        ========================================== -->

        <button
            type="submit"
            class="btn btn-warning">

            Passwort speichern

        </button>


        <a
            href="{% url 'user_list' %}"
            class="btn btn-secondary">

            Zurück

        </a>

    </form>

</div>

{% endblock %}
