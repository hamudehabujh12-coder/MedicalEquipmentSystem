{% extends "devices/base.html" %}

{% block content %}

<div class="container py-4">

    <h2>✏️ Dokument bearbeiten</h2>

    <form method="post">

        {% csrf_token %}

        <!-- Dokumentname -->
        <div class="mb-3">

            <label class="form-label">
                Dokumentname
            </label>

            <input
                type="text"
                name="new_name"
                value="{{ doc.title }}"
                class="form-control"
                required>

        </div>


        <!-- Dokumentart -->
        <div class="mb-3">

            <label class="form-label">
                Dokumentart
            </label>

            <select
                name="category"
                class="form-select"
                required>

                {% for value, label in category_choices %}

                    <option
                        value="{{ value }}"
                        {% if doc.category == value %}
                            selected
                        {% endif %}
                    >
                        {{ label }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <!-- Buttons -->
        <div class="mt-4">

            <button
                type="submit"
                class="btn btn-success">

                💾 Speichern

            </button>

            <a
                href="{% url 'technician_documents' %}"
                class="btn btn-secondary">

                Abbrechen

            </a>

        </div>

    </form>

</div>

{% endblock %}
