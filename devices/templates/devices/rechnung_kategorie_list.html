{% extends "devices/base.html" %}
{% block content %}
<h1>🏷️ Rechnung Kategorien</h1>
<div style="margin-bottom:20px;">
    <a
        href="{% url 'add_rechnung_kategorie' %}"
        class="add-btn"
    >
        ➕ Neue Kategorie
    </a>
</div>
<table class="table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Aktionen</th>
        </tr>
    </thead>
    <tbody>
    {% for kategorie in kategorien %}
        <tr>
            <td>
                {{ kategorie.name }}
            </td>
            <td>
                <a
                    href="{% url 'edit_rechnung_kategorie' kategorie.id %}"
                >
                    ✏️ Bearbeiten
                </a>
                |
                <form
                    method="POST"
                    action="{% url 'delete_rechnung_kategorie' kategorie.id %}"
                    style="display:inline;"
                    onsubmit="return confirm('Kategorie wirklich löschen?');"
                >
                    {% csrf_token %}
                    <button
                        class="delete-btn"
                        type="submit"
                    >
                        🗑️ Löschen
                    </button>
                </form>
            </td>
        </tr>
    {% empty %}
        <tr>
            <td colspan="2">
                Keine Kategorien vorhanden.
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
<style>
.delete-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
}
.delete-btn:hover{
    background:#b91c1c;
}
.add-btn{
    background:#16a34a;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}
.add-btn:hover{
    background:#15803d;
}
.table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}
.table th{
    background:#1f2937;
    color:white;
    padding:15px;
}
.table td{
    padding:14px;
    border-bottom:1px solid #e5e7eb;
    text-align:center;
}
.table tr:hover{
    background:#f8fafc;
}
.table a{
    text-decoration:none;
    font-weight:bold;
    color:#2563eb;
}
</style>
{% endblock %}
