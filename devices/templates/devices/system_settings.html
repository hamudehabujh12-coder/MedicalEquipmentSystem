{% extends "devices/base.html" %}

{% block content %}

<div class="settings-container">

<h1>⚙️ System bearbeiten</h1>


<form method="POST">

{% csrf_token %}



<label>
Design
</label>

<select name="theme">

<option value="light"
{% if request.session.theme == "light" %}selected{% endif %}>
Hell
</option>

<option value="dark"
{% if request.session.theme == "dark" %}selected{% endif %}>
Dunkel
</option>

</select>


<br><br>


<button type="submit">
Speichern
</button>


</form>


</div>

{% endblock %}
