{% extends "devices/base.html" %}

{% block content %}

<h1>➕ Neue Rechnung Kategorie</h1>

<form method="POST">

    {% csrf_token %}

    <div class="form-group">

        <label>
            Kategorie
        </label>

        <input
            type="text"
            name="name"
            class="form-control"
            placeholder="z. B. Medizintechnik"
            required
            autofocus
        >

    </div>

    <br>

    <button
        type="submit"
        class="btn btn-success"
    >
        💾 Speichern
    </button>

    <a
        href="{% url 'rechnung_kategorie_list' %}"
        class="btn btn-secondary"
    >
        ❌ Abbrechen
    </a>

</form>

{% endblock %}
