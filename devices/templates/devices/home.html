{% extends "devices/base.html" %}

{% block content %}

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

<div class="home-container">

    {% if home.title %}
        <h1 class="home-title">
            {{ home.title }}
        </h1>
    {% endif %}

    <div class="carousel">

        {% for image in home.images.all %}

        <span class="item" style="--i:{{ forloop.counter0 }}">
            <img src="{{ image.image.url }}" alt="">
        </span>

        {% endfor %}

    </div>
</div>

<style>

body{
    margin:0;
    background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
    overflow:hidden;
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
}

.home-container{
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:center;
    min-height:100vh;
    perspective:1100px;
    padding-top: 0;
}

.home-title{
    position: relative;
    display: inline-block;
    font-size:52px;
    font-weight:700;
    font-style: italic;
    color:white;
    transform:skewX(-8deg);
    letter-spacing:1px;
    text-shadow:0 8px 20px rgba(0,0,0,.35);
    margin-top:-40px;
    margin-bottom:15px;
    animation:fadeTitle .8s ease;
}

.home-title::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-12px;
    transform:translateX(-50%);
    width:180px;
    height:4px;
    border-radius:50px;
    background:linear-gradient(90deg,#0d6efd,#38bdf8,#ffffff,#38bdf8,#0d6efd);
    box-shadow:0 0 15px rgba(56,189,248,.8);
}

.carousel{
    position:relative;
    width: 40px;0px;
    height:500px;
    margin:100px auto 0;
    left: 0;
    right: 0;
    transform-style:preserve-3d;
    animation:spin 20s linear infinite;
}



.item{
    position:absolute;
    inset:0;
    transition:0.5s;
}

.item img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:20px;
    border:2px solid rgba(255,255,255,.2);
    box-shadow:0 15px 35px rgba(0,0,0,.4);
}

.item img:hover{
    transform:scale(1.05);
}

@keyframes spin{
    from{
        transform:rotateX(-8deg) rotateY(0deg);
    }
    to{
        transform:rotateX(-8deg) rotateY(360deg);
    }
}

@media(max-width:900px){

    .carousel{
        width:170px;
        height:240px;
    }

}
@keyframes fadeTitle{

    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}
</style>

<script>

const items = document.querySelectorAll(".carousel .item");
const total = items.length;

items.forEach((item, index) => {

    const angle = (360 / total) * index;

    item.style.transform = `
        rotateY(${angle}deg)
        translateZ(300px)
    `;

});

</script>

{% endblock %}
