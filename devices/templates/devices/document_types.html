{% extends "devices/base.html" %}

{% block content %}

<h1>📄 Dokumenttypen</h1>

<div style="margin-bottom:20px;">

    <a href="{% url 'add_document_type' %}" class="add-btn">
        ➕ Neuer Dokumenttyp
    </a>

</div>

<table class="table">

    <thead>
        <tr>
            <th>Name</th>
            <th>Aktionen</th>
        </tr>
    </thead>

    <tbody>

    {% for type in types %}

        <tr>

            <td>{{ type.name }}</td>

            <td>

                <a href="{% url 'edit_document_type' type.id %}">
                    ✏️ Bearbeiten
                </a>

                |

                <form method="POST"
                      action="{% url 'delete_document_type' type.id %}"
                      style="display:inline;"
                      onsubmit="return confirm('Dokumenttyp wirklich löschen?');">

                    {% csrf_token %}

                    <button class="delete-btn" type="submit">
                        🗑️ Löschen
                    </button>

                </form>

            </td>

        </tr>

    {% empty %}

        <tr>
            <td colspan="2">
                Keine Dokumenttypen vorhanden.
            </td>
        </tr>

    {% endfor %}

    </tbody>

</table>

<style>

.delete-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
}

.delete-btn:hover{
    background:#b91c1c;
}

.add-btn{
    background:#16a34a;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

.table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.table th{
    background:#1f2937;
    color:white;
    padding:15px;
}

.table td{
    padding:14px;
    border-bottom:1px solid #e5e7eb;
    text-align:center;
}

.table tr:hover{
    background:#f8fafc;
}

.table a{
    text-decoration:none;
    font-weight:bold;
    color:#2563eb;
}

</style>

{% endblock %}
