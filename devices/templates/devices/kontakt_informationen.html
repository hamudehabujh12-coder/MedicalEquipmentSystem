{% extends "devices/base.html" %}

{% block content %}

<h1>📞 Kontakt Informationen</h1>


<div class="backup-card">


<form method="POST" enctype="multipart/form-data">

{% csrf_token %}


<label>
Techniker Name
</label>

<input 
type="text"
name="technician_name"
value="{{ kontakt.technician_name }}"
>


<label>
E-Mail-Adresse
</label>

<input 
type="email"
name="email"
value="{{ kontakt.email }}"
>


<label>
Telefonnummer
</label>

<input 
type="text"
name="phone"
value="{{ kontakt.phone }}"
>


<label>
Adresse
</label>

<textarea 
name="address"
rows="4"
>{{ kontakt.address }}</textarea>


<label>Kontakt Bilder</label>

<input
type="file"
name="images"
multiple>

{% if kontakt.images.all %}

<div class="gallery">

    {% for image in kontakt.images.all %}

    <div class="image-card">

        <img src="{{ image.image.url }}">

        <label class="delete-label">
            <input
                type="checkbox"
                name="delete_images"
                value="{{ image.id }}">
            Bild löschen
        </label>

    </div>

    {% endfor %}

</div>

{% endif %}

<br>

<div class="button-group">


    <button
        type="submit"
        class="delete-btn"
        name="delete_selected"
        value="1">

        🗑 Ausgewählte Bilder löschen

    </button>

</div>

<br><br>


<button type="submit" class="backup-btn">
💾 Speichern
</button>


</form>


</div>



<style>

.backup-card{

background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);

}


label{

display:block;
margin-top:15px;
font-weight:bold;

}


input,
textarea{

width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
margin-top:5px;

}


.backup-btn{

background:#2563eb;
color:white;
border:none;
padding:12px 25px;
border-radius:8px;
cursor:pointer;

}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
    margin-top:25px;
}

.image-card{
    background:white;
    border-radius:15px;
    padding:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    text-align:center;
}

.image-card img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:12px;
}

.delete-label{
    display:block;
    margin-top:10px;
    font-size:15px;
}

.button-group{
    display:flex;
    gap:12px;
    margin-top:20px;
}

.delete-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
}

.delete-btn:hover{
    background:#b91c1c;
}
</style>


{% endblock %}
